name: NEXXT

options:
  bundleIdPrefix: com.nexxt
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic

targets:
  NEXXT:
    type: application
    platform: iOS

    sources:
      - path: .
        excludes:
          - project.yml
          - .github/**
          - .git/**
          - README.md
          - FIRESTORE_RULES.txt
          - "*.md"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexxt.messenger
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
