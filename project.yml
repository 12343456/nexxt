name: NEXXT

options:
  bundleIdPrefix: com.nexxt
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  NEXXT:
    type: application
    platform: iOS

    sources:
      - path: .

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexxt.messenger
        INFOPLIST_KEY_CFBundleDisplayName: NEXXT
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: NEXXT использует локальную сеть для подключения к устройствам.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: NEXXT использует Bluetooth для обнаружения устройств.
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: NEXXT использует Bluetooth для работы с устройствами.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false

    dependencies:
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: CoreBluetooth.framework
