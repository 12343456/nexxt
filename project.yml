name: NEXXT

options:
  bundleIdPrefix: com.nexxt
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    CODE_SIGN_STYLE: Automatic

targets:
  NEXXT:
    type: application
    platform: iOS

    sources:
      - path: .
        excludes:
          - project.yml
          - .github
          - README.md
          - FIRESTORE_RULES.txt

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexxt.messenger
        INFOPLIST_KEY_CFBundleDisplayName: NEXXT
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
