name: Build NEXXT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove old workflow project file
        run: rm -f .github/workflows/project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build NEXXT
        run: |
          xcodebuild \
            -project NEXXT.xcodeproj \
            -scheme NEXXT \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package app
        run: |
          mkdir -p artifact
          cp -R build/Build/Products/Release-iphoneos/NEXXT.app artifact/NEXXT.app

      - name: Upload NEXXT
        uses: actions/upload-artifact@v4
        with:
          name: NEXXT-app
          path: artifact/NEXXT.app
